<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ONE Directional</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

body {
    position: relative;
    font-family: Arial, sans-serif;
}

/* =========================
   ONE
========================= */

.one {
    position: absolute;
    border-radius: 50%;
    background: #fff;

    transform:
        translate3d(-50%, -50%, 0);

    pointer-events: none;

    box-shadow:
        0 0 22px rgba(255,255,255,.8);
}


/* =========================
   TRAIL
========================= */

.trail {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #fff;

    pointer-events: none;

    opacity: .65;

    animation:
        trailFade 900ms linear forwards;
}

@keyframes trailFade {

    from {
        opacity: .65;
        transform: scale(1);
    }

    to {
        opacity: 0;
        transform: scale(.35);
    }
}


/* =========================
   RESET
========================= */

#reset {

    position: fixed;

    top: 20px;
    right: 20px;

    padding: 9px 14px;

    border: 1px solid #333;

    border-radius: 20px;

    background: rgba(0,0,0,.7);

    color: #aaa;

    font-size: 11px;

    letter-spacing: .15em;

    z-index: 1000;
}
</style>
</head>

<body>

<button id="reset">
RESET
</button>

<script>

/* =========================
   CONSTANTS
========================= */

const MIN_SIZE = 34;
const MAX_SIZE = 180;

const DOUBLE_TAP_TIME = 350;

const TRAIL_DISTANCE = 35;
const TRAIL_DISTANCE_SQ =
    TRAIL_DISTANCE * TRAIL_DISTANCE;

const MERGE_DISTANCE = 20;
const MERGE_DISTANCE_SQ =
    MERGE_DISTANCE * MERGE_DISTANCE;

const MAGNETIC_DISTANCE = 180;
const MAGNETIC_DISTANCE_SQ =
    MAGNETIC_DISTANCE * MAGNETIC_DISTANCE;

const MAGNETIC_STRENGTH = 0.045;


/* =========================
   STATE
========================= */

let ones = [];

let selectedOne = null;

let isHolding = false;

let lastTapTime = 0;


/* =========================
   CREATE ONE
========================= */

function createOne(
    x,
    y,
    size = MIN_SIZE,
    isMemory = false
) {

    const element =
        document.createElement("div");

    element.className =
        "one";

    document.body.appendChild(element);

    const one = {

        x: x,
        y: y,

        targetX: x,
        targetY: y,

        size: size,

        element: element,

        lastTrailX: x,
        lastTrailY: y,

        isMemory: isMemory
    };

    ones.push(one);

    updateOne(one);

    return one;
}


/* =========================
   UPDATE ONE
========================= */

function updateOne(one) {

    one.element.style.left =
        one.x + "px";

    one.element.style.top =
        one.y + "px";

    one.element.style.width =
        one.size + "px";

    one.element.style.height =
        one.size + "px";
}


/* =========================
   TRAIL
========================= */

function createTrail(one) {

    const dx =
        one.x - one.lastTrailX;

    const dy =
        one.y - one.lastTrailY;

    const distanceSq =
        dx * dx + dy * dy;

    if (
        distanceSq <
        TRAIL_DISTANCE_SQ
    ) {
        return;
    }

    const trail =
        document.createElement("div");

    trail.className =
        "trail";

    trail.style.left =
        one.x + "px";

    trail.style.top =
        one.y + "px";

    document.body.appendChild(trail);

    setTimeout(
        () => trail.remove(),
        900
    );

    one.lastTrailX =
        one.x;

    one.lastTrailY =
        one.y;
}


/* =========================
   DIRECTIONAL SPLIT
========================= */

function splitOne(
    one,
    touchX,
    touchY
) {

    if (!one) {
        return;
    }

    let dx =
        touchX - one.x;

    let dy =
        touchY - one.y;

    const distanceSq =
        dx * dx + dy * dy;


    if (distanceSq < 1) {

        dx = 1;
        dy = 0;

    } else {

        const distance =
            Math.sqrt(distanceSq);

        dx /= distance;
        dy /= distance;
    }


    const newOne =
        createOne(
            one.x + dx * 45,
            one.y + dy * 45,
            MIN_SIZE
        );


    selectedOne =
        newOne;
}


/* =========================
   MERGE
========================= */

function mergeOnes(a, b) {

    const midpointX =
        (a.x + b.x) / 2;

    const midpointY =
        (a.y + b.y) / 2;

    const combinedSize =
        Math.min(
            MAX_SIZE,
            a.size + b.size
        );


    a.element.remove();
    b.element.remove();


    ones =
        ones.filter(
            one =>
                one !== a &&
                one !== b
        );


    const merged =
        createOne(
            midpointX,
            midpointY,
            combinedSize,
            true
        );


    selectedOne =
        merged;
}


/* =========================
   MAGNETISM
========================= */

function applyMagnetism() {

    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < ones.length;
            j++
        ) {

            const a = ones[i];
            const b = ones[j];


            const dx =
                b.x - a.x;

            const dy =
                b.y - a.y;

            const distanceSq =
                dx * dx + dy * dy;


            if (
                distanceSq <= 0 ||
                distanceSq >
                MAGNETIC_DISTANCE_SQ
            ) {
                continue;
            }


            const distance =
                Math.sqrt(distanceSq);


            const sizeDifference =
                Math.abs(
                    a.size - b.size
                );


            if (
                sizeDifference <= 0
            ) {
                continue;
            }


            let large;
            let small;


            if (
                a.size > b.size
            ) {

                large = a;
                small = b;

            } else {

                large = b;
                small = a;
            }


            const nx =
                (small.x - large.x) /
                distance;

            const ny =
                (small.y - large.y) /
                distance;


            const distanceFactor =
                1 -
                distance /
                MAGNETIC_DISTANCE;


            const sizeFactor =
                sizeDifference /
                MAX_SIZE;


            const force =
                MAGNETIC_STRENGTH *
                distanceFactor *
                sizeFactor;


            small.targetX +=
                nx * force * 100;

            small.targetY +=
                ny * force * 100;
        }
    }
}


/* =========================
   TOUCH START
========================= */

document.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();


        if (
            event.target ===
            document.getElementById("reset")
        ) {
            return;
        }


        const touch =
            event.touches[0];

        const x =
            touch.clientX;

        const y =
            touch.clientY;


        let closest = null;

        let closestDistanceSq =
            Infinity;


        for (
            const one of ones
        ) {

            const dx =
                one.x - x;

            const dy =
                one.y - y;

            const distanceSq =
                dx * dx + dy * dy;


            if (
                distanceSq <
                closestDistanceSq
            ) {

                closestDistanceSq =
                    distanceSq;

                closest =
                    one;
            }
        }


        if (!closest) {
            return;
        }


        selectedOne =
            closest;


        selectedOne.targetX =
            x;

        selectedOne.targetY =
            y;


        isHolding = true;


        const now =
            performance.now();


        if (
            now - lastTapTime <=
            DOUBLE_TAP_TIME
        ) {

            splitOne(
                selectedOne,
                x,
                y
            );
        }


        lastTapTime =
            now;
    },
    {
        passive: false
    }
);


/* =========================
   TOUCH MOVE
========================= */

document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        if (
            !isHolding ||
            !selectedOne
        ) {
            return;
        }


        const touch =
            event.touches[0];


        selectedOne.targetX =
            touch.clientX;

        selectedOne.targetY =
            touch.clientY;
    },
    {
        passive: false
    }
);


/* =========================
   TOUCH END
========================= */

document.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        isHolding = false;
    },
    {
        passive: false
    }
);


/* =========================
   RESET
========================= */

document.getElementById("reset")
    .addEventListener(
        "click",
        function(event) {

            event.preventDefault();
            event.stopPropagation();


            for (
                const one of ones
            ) {

                one.element.remove();
            }


            ones = [];

            selectedOne = null;

            isHolding = false;

            lastTapTime = 0;


            createOne(
                window.innerWidth / 2,
                window.innerHeight / 2,
                MIN_SIZE
            );
        }
    );


/* =========================
   MAIN LOOP
========================= */

function animate() {

    applyMagnetism();


    for (
        const one of ones
    ) {

        /*
           MASTER MOVEMENT
           PRESERVED AT 0.10
        */

        one.x +=
            (
                one.targetX -
                one.x
            ) * 0.10;

        one.y +=
            (
                one.targetY -
                one.y
            ) * 0.10;


        /*
           HOLD TO GROW
        */

        if (
            isHolding &&
            selectedOne === one
        ) {

            one.size =
                Math.min(
                    MAX_SIZE,
                    one.size + 0.5
                );
        }


        createTrail(one);

        updateOne(one);
    }


    /*
       MERGE CHECK
    */

    let didMerge = false;


    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < ones.length;
            j++
        ) {

            const a = ones[i];
            const b = ones[j];


            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;


            const distanceSq =
                dx * dx + dy * dy;


            if (
                distanceSq <=
                MERGE_DISTANCE_SQ
            ) {

                mergeOnes(a, b);

                didMerge = true;

                break;
            }
        }


        if (didMerge) {
            break;
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* =========================
   START
========================= */

createOne(
    window.innerWidth / 2,
    window.innerHeight / 2,
    MIN_SIZE
);

animate();

</script>

</body>
</html>
