<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ONE — V13</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

body {
    position: relative;
    font-family: Arial, sans-serif;
}


/* =================================================
   ONE
================================================= */

.one {

    position: absolute;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    box-shadow:
        0 0 10px white,
        0 0 25px rgba(255,255,255,0.8),
        0 0 45px rgba(255,255,255,0.4);
}


/* =================================================
   MERGED ONE
================================================= */

.memory-one {

    box-shadow:
        0 0 12px white,
        0 0 30px white,
        0 0 55px rgba(255,255,255,0.9);
}


/* =================================================
   TRAIL
================================================= */

.trail {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    opacity: 0.8;

    box-shadow:
        0 0 6px white;

    animation:
        fadeTrail 1.5s linear forwards;
}


@keyframes fadeTrail {

    from {
        opacity: 0.8;
    }

    to {
        opacity: 0;
    }
}


/* =================================================
   RESET
================================================= */

#reset {

    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 1000;

    padding: 10px 16px;

    border:
        1px solid
        rgba(255,255,255,0.35);

    border-radius: 20px;

    background:
        rgba(0,0,0,0.6);

    color: white;

    font-size: 14px;

    user-select: none;
    -webkit-user-select: none;
}

</style>
</head>


<body>

<button id="reset">RESET</button>


<script>

/*
==================================================
ONE — V13
==================================================

THIS IS V12 BEHAVIOR PRESERVED.

ONE
↓
TWO
↓
MOVE
↓
GROW
↓
TRAIL
↓
MERGE
↓
NEW GLOWING PLAYABLE ONE
↓
DOUBLE TAP
↓
TWO AGAIN


IMPORTANT:

There is NO automatic movement.

There is NO pulling.

There is NO repulsion.

There is NO permanent object.

Every ONE moves only according
to its own target.

The original 0.10 movement is
preserved exactly.

==================================================
*/


const MIN_SIZE = 34;

const MAX_SIZE = 180;

const DOUBLE_TAP_TIME = 350;

const TRAIL_DISTANCE = 35;

const MERGE_DISTANCE = 20;


/* =================================================
   ALL PLAYABLE ONES
================================================= */

let ones = [];


/* =================================================
   CONTROL
================================================= */

let selectedOne = null;

let growing = false;

let lastTap = 0;


/* =================================================
   CREATE ONE
================================================= */

function createOne(
    px,
    py,
    startingSize = MIN_SIZE,
    isMemory = false
) {

    const element =
        document.createElement("div");

    element.className = "one";


    if (isMemory) {

        element.classList.add(
            "memory-one"
        );
    }


    document.body.appendChild(
        element
    );


    const one = {

        x: px,
        y: py,

        targetX: px,
        targetY: py,

        size: startingSize,

        element: element,

        isMemory: isMemory,

        lastTrailX: px,
        lastTrailY: py
    };


    ones.push(one);

    updateOne(one);

    return one;
}


/* =================================================
   UPDATE
================================================= */

function updateOne(one) {

    one.element.style.left =
        one.x + "px";

    one.element.style.top =
        one.y + "px";

    one.element.style.width =
        one.size + "px";

    one.element.style.height =
        one.size + "px";
}


/* =================================================
   DISTANCE
================================================= */

function distance(
    ax,
    ay,
    bx,
    by
) {

    const dx =
        bx - ax;

    const dy =
        by - ay;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =================================================
   TRAIL
================================================= */

function createTrail(
    px,
    py
) {

    const trail =
        document.createElement(
            "div"
        );

    trail.className =
        "trail";

    trail.style.left =
        px + "px";

    trail.style.top =
        py + "px";

    document.body.appendChild(
        trail
    );


    setTimeout(
        () => trail.remove(),
        1500
    );
}


/* =================================================
   FIND CLOSEST ONE
================================================= */

function findClosestOne(
    px,
    py
) {

    if (
        ones.length === 0
    ) {

        return null;
    }


    let closest = null;

    let closestDistance =
        Infinity;


    for (
        const one of ones
    ) {

        const d =
            distance(
                px,
                py,
                one.x,
                one.y
            );


        if (
            d <
            closestDistance
        ) {

            closestDistance = d;

            closest = one;
        }
    }


    return closest;
}


/* =================================================
   SPLIT
================================================= */

function splitOne(one) {

    /*
        Original keeps its size.

        New ONE starts at 34.
    */

    const newOne =
        createOne(
            one.x + 45,
            one.y,
            MIN_SIZE,
            false
        );


    newOne.targetX =
        newOne.x;

    newOne.targetY =
        newOne.y;


    /*
        Keep control on the
        original ONE.
    */

    selectedOne =
        one;

    growing = false;
}


/* =================================================
   MERGE
================================================= */

function mergeOnes(
    oneA,
    oneB
) {

    /*
        Find exact meeting point.
    */

    const mergeX =
        (
            oneA.x +
            oneB.x
        ) / 2;

    const mergeY =
        (
            oneA.y +
            oneB.y
        ) / 2;


    /*
        Combine sizes.
    */

    const mergedSize =
        Math.min(
            MAX_SIZE,
            oneA.size +
            oneB.size
        );


    /*
        Remove old TWO.
    */

    oneA.element.remove();

    oneB.element.remove();


    ones =
        ones.filter(
            one =>
                one !== oneA &&
                one !== oneB
        );


    /*
        Create ONE new glowing,
        fully playable ONE.
    */

    const mergedOne =
        createOne(
            mergeX,
            mergeY,
            mergedSize,
            true
        );


    /*
        Immediately make it
        the selected ONE.
    */

    selectedOne =
        mergedOne;

    growing = false;
}


/* =================================================
   CHECK MERGE
================================================= */

function checkForMerges() {

    if (
        ones.length < 2
    ) {

        return;
    }


    for (
        let i = 0;
        i < ones.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < ones.length;
            j++
        ) {

            const oneA =
                ones[i];

            const oneB =
                ones[j];


            const d =
                distance(
                    oneA.x,
                    oneA.y,
                    oneB.x,
                    oneB.y
                );


            if (
                d <=
                MERGE_DISTANCE
            ) {

                mergeOnes(
                    oneA,
                    oneB
                );

                return;
            }
        }
    }
}


/* =================================================
   POINTER DOWN
================================================= */

function pointerDown(
    px,
    py
) {

    const now =
        Date.now();


    const closest =
        findClosestOne(
            px,
            py
        );


    if (!closest) {

        return;
    }


    /*
        DOUBLE TAP
    */

    if (
        now - lastTap <
        DOUBLE_TAP_TIME
    ) {

        splitOne(
            closest
        );


        lastTap = 0;

        return;
    }


    lastTap = now;


    /*
        Select ONE.
    */

    selectedOne =
        closest;


    /*
        Holding grows it.
    */

    growing = true;


    /*
        Move toward finger.
    */

    selectedOne.targetX =
        px;

    selectedOne.targetY =
        py;
}


/* =================================================
   POINTER MOVE
================================================= */

function pointerMove(
    px,
    py
) {

    if (!growing) {

        return;
    }


    if (!selectedOne) {

        return;
    }


    selectedOne.targetX =
        px;

    selectedOne.targetY =
        py;
}


/* =================================================
   POINTER UP
================================================= */

function pointerUp() {

    growing = false;
}


/* =================================================
   POINTER EVENTS
================================================= */

document.addEventListener(
    "pointerdown",
    function(e) {

        if (
            e.target.id ===
            "reset"
        ) {

            return;
        }


        pointerDown(
            e.clientX,
            e.clientY
        );
    }
);


document.addEventListener(
    "pointermove",
    function(e) {

        if (
            e.target.id ===
            "reset"
        ) {

            return;
        }


        pointerMove(
            e.clientX,
            e.clientY
        );
    }
);


document.addEventListener(
    "pointerup",
    pointerUp
);


document.addEventListener(
    "pointercancel",
    pointerUp
);


/* =================================================
   MAIN LOOP
================================================= */

function animate() {

    /*
        THIS IS THE ORIGINAL
        FLUID MOVEMENT.

        DO NOT CHANGE.

        x += (targetX - x) * 0.10
        y += (targetY - y) * 0.10
    */

    for (
        const one of ones
    ) {

        one.x +=
            (
                one.targetX -
                one.x
            ) * 0.10;


        one.y +=
            (
                one.targetY -
                one.y
            ) * 0.10;


        /*
            ONLY THE SELECTED ONE
            GROWS.
        */

        if (
            growing &&
            selectedOne === one
        ) {

            one.size += 0.5;


            if (
                one.size >
                MAX_SIZE
            ) {

                one.size =
                    MAX_SIZE;
            }
        }


        /*
            TRAIL.
        */

        if (
            distance(
                one.x,
                one.y,
                one.lastTrailX,
                one.lastTrailY
            ) >=
            TRAIL_DISTANCE
        ) {

            createTrail(
                one.x,
                one.y
            );


            one.lastTrailX =
                one.x;

            one.lastTrailY =
                one.y;
        }


        updateOne(one);
    }


    /*
        Merge is the ONLY interaction
        between TWO.
    */

    checkForMerges();


    requestAnimationFrame(
        animate
    );
}


/* =================================================
   RESET
================================================= */

function resetGame() {

    /*
        Remove ONES.
    */

    for (
        const one of ones
    ) {

        one.element.remove();
    }


    ones = [];


    /*
        Remove trails.
    */

    document
        .querySelectorAll(
            ".trail"
        )
        .forEach(
            element =>
                element.remove()
        );


    /*
        Start again.
    */

    selectedOne =
        createOne(
            window.innerWidth / 2,
            window.innerHeight / 2,
            MIN_SIZE,
            false
        );


    growing = false;

    lastTap = 0;
}


/* =================================================
   RESET BUTTON
================================================= */

const resetButton =
    document.getElementById(
        "reset"
    );


resetButton.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        resetGame();
    }
);


/* =================================================
   START
================================================= */

selectedOne =
    createOne(
        window.innerWidth / 2,
        window.innerHeight / 2,
        MIN_SIZE,
        false
    );


animate();

</script>

</body>
</html>
